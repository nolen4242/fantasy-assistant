[project]
name = "fantasy-assistant"
version = "0.1.0"
description = "In-season strategic intelligence system for the Bob Uecker league"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.23",
    "pydantic>=2.8",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_assistant"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
